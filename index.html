<!DOCTYPE html>
<html>
    <head>
        <title>Google Drive Direct MP4 Link Generator</title>
        <style>
          body {
              background-color: #0f0f0f;
              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
              color: white;
              display: flex;
              justify-content: center;
              align-items: center;
              height: 100vh;
              margin: 0;
          }
          .container {
              text-align: center;
              width: 80%;
              max-width: 600px;
              padding: 40px;
              background: #1a1a1a;
              border-radius: 15px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          }
          input[type=text] {
              width: 100%;
              padding: 15px;
              margin: 20px 0;
              border: 1px solid #333;
              border-radius: 8px;
              background: #252525;
              color: white;
              font-size: 16px;
              box-sizing: border-box;
          }
          h1 {
              font-size: 2.5rem;
              margin-bottom: 10px;
              color: #00CDFF;
          }
          .button {
              background-color: #00CDFF;
              border: none;
              color: black;
              padding: 15px 30px;
              font-weight: bold;
              font-size: 16px;
              border-radius: 50px;
              cursor: pointer;
              transition: 0.3s;
              text-decoration: none;
              display: inline-block;
          }
          .button:hover {
              background-color: #008fb3;
              transform: scale(1.05);
          }
          .result-box {
              margin-top: 30px;
              padding: 15px;
              background: #252525;
              border-radius: 8px;
              word-break: break-all;
              display: none; /* පස්සේ පෙන්වන්න */
          }
          #finalLink {
              color: #00FF7F;
              font-family: monospace;
          }
          .footer {
              margin-top: 40px;
              font-size: 12px;
              color: #666;
          }
        </style>
    </head>
    <body>
        <div class="container">
             <h1>GDrive MP4 Link</h1>
             <p>පහතින් Google Drive Share Link එක ඇතුළත් කරන්න</p>
             
             <input type="text" id="glink" placeholder="https://drive.google.com/file/d/XXXXX/view">
             
             <button onclick="generateLink()" class="button">Generate MP4 Link</button>

             <div id="resultArea" class="result-box">
                 <p style="margin:0 0 10px 0; font-size: 14px;">ඔයාගේ Direct Link එක:</p>
                 <span id="finalLink"></span>
             </div>

             <div class="footer">
                 <p>* මතක ඇතුව වීඩියෝ එක "Anyone with the link" ලෙස Public කරන්න.</p>
             </div>
        </div>

        <script>
            function generateLink() {
                var input = document.getElementById("glink").value;
                
                // Regular Expression එකක් පාවිච්චි කරලා ID එක විතරක් ගන්නවා (මේක වඩාත් නිවැරදියි)
                var matches = input.match(/\/d\/(.+?)\/(view|edit|copy)/) || input.match(/id=(.+?)(&|$)/);
                
                if (matches && (matches[1])) {
                    var id = matches[1];
                    
                    // MP4 විදියට ප්ලේ කරන්න පුළුවන් ලේසිම ලින්ක් එක
                    var directLink = "https://drive.google.com/uc?export=download&id=" + id;
                    
                    document.getElementById("finalLink").innerHTML = directLink;
                    document.getElementById("resultArea").style.display = "block";
                } else {
                    alert("කරුණාකර නිවැරදි Google Drive ලින්ක් එකක් ලබා දෙන්න.");
                }
            }
        </script>
    </body>
</html>
